# how many pages it could map. The program that makes the memory grant real, not parsed-and-ignored.
[[bin]]
name = "budgeter"
path = "src/budgeter.rs"
test = false
bench = false

# The heeder (DECISIONS §24): a long-running job that heeds the cooperative ^C, polling a shared flag
