# kernel/src/drivers/pl011.rs's own idiom for the identical hardware. Pinned to the same version as
# kernel/Cargo.toml's own dependency so the two crates using this library never skew.
tock-registers = "0.10"

# smoltcp (milestone 30, piece 3): the userspace TCP/IP stack. no_std, heap over user_rt's
# UntypedHeap. Pinned at 0.13.1; divergence policy is the vendored-engine discipline (DECISIONS §18).
smoltcp = { version = "0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    # Multicast group membership (milestone 55's mDNS stack half): join_multicast_group, IGMP, and,
    # the part that matters, RX acceptance of datagrams addressed to a joined group. Without this
    # feature the IPv4 input path accepts multicast only to 224.0.0.1 (all-systems, hardcoded), so
    # a datagram to mDNS's 224.0.0.251 is dropped before UDP ever sees it. In smoltcp's own default
    # feature set; `default-features = false` had discarded it. See notes/mdns.md.
    "multicast",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
] }
