# new capability at all: `monotonic_nanos` is granted to every process unconditionally
# (kernel/src/arch/*/timer.rs's documented exception to DECISIONS §10), so this program's manifest
# is `worker`'s, not `date`'s. The formatting is crates/uptime, host-tested. Portable, so both
# ISAs' archives carry it. **Provisional name**: the same word upstream `procps` uses; see the
# crate's module docs for why it is flagged anyway.
[[bin]]
name = "uptime"
path = "src/uptime.rs"
test = false
bench = false

[lints]
workspace = true

# `doc` (milestone 40): the documentation viewer. Markdown on its input, rendered text on its
# output, and nothing else in its cspace; the rendering itself is `crates/manual`, which is
# host-tested. **Provisional name.**
[[bin]]
name = "doc"
path = "src/doc.rs"
test = false
bench = false

