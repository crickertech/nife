# Name: unrecorded, and the weakest of the four structural ones. `user` is the package holding every
# EL0 program, so it is named for the privilege level its contents run at, which a reader meets as
# `user/src/<program>.rs` far more often than as a package name. It is generic in the way AGENTS.md
# flags (`compose`, `measure`, `regions` were all renamed away from words like it), and it survives on
# the same argument `kernel` does: position supplies the meaning and the name appears in one manifest.
# If any of these four wants revisiting, this is the one.

[package]
name = "user"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "hello"
path = "src/hello.rs"
# This is a bare-metal `no_std` binary with no unit tests, and the default test/bench targets link
# libtest (`extern crate test`), which does not exist for the aarch64-unknown-none target. Turning
# them off is what lets `cargo clippy --all-targets` (and any --all-targets build) work here instead
# of failing to find crate `test`. The kernel keeps its test target because it supplies its own
# harness via `custom_test_frameworks`.
test = false
bench = false

# The worker (milestone 19f.2): the first program that is its own binary, not a role of `hello`.
# It shares this package's `build.rs` link.ld (linked at 0x40_0000) but no code. Same test/bench
# reasoning as above. `initrd_aarch64` packs it into the archive under the name "worker".
[[bin]]
name = "worker"
path = "src/worker.rs"
test = false
bench = false

# The console server (milestone 19f.3): the second program lifted out of `hello`. `initrd_aarch64` packs
# it under "console"; init loads it by name.
[[bin]]
name = "console"
path = "src/console.rs"
test = false
bench = false

# The input driver (milestone 19f.4): the receive half of the terminal, lifted out of hello.
# Since milestone 28 it is a raw byte forwarder; the editing lives in line_editor.
[[bin]]
name = "input"
path = "src/input.rs"
test = false
bench = false

# The line discipline (milestone 28): the tty layer as a swappable userspace component between
# the input/console drivers and applications. Serves the terminal contract
# (notes/terminal-contract.md); the editing engine is the host-tested `line_editor` crate.
[[bin]]
name = "line_editor"
path = "src/line_editor.rs"
test = false
bench = false

# `terminal_sink_caretaker` (milestone 50's last remainder): the terminal as a destination for the sink
# contract. A caretaker in `fs_file_caretaker`'s shape, and a separate process for a capability
# reason rather than a scheduling one: the terminal endpoint also carries OP_READLINE, so a child
# handed it as its output slot would hold the keyboard. **Provisional name.**
[[bin]]
name = "terminal_sink_caretaker"
path = "src/terminal_sink_caretaker.rs"
test = false
bench = false

# `swish` (milestone 19f.5): the shell, the last program lifted out of hello, and the most wired.
# A swish is the shot that goes through the net touching nothing, which is least authority in one
# word. `initrd_aarch64` packs it as "swish"; `system_initializer` loads it by that name.
[[bin]]
name = "swish"
path = "src/swish.rs"
test = false
bench = false

