# The `getrandom` backend for nife (milestone 64, rank 1 of the measured gap list). See src/lib.rs
# for what it is and why it is a crate; notes/crates-io-on-nife.md for the measurement that ranked it
# first.
#
# Deliberately NOT a member of the main workspace, for `std_exerciser`'s reason and one more of its
# own. It needs `std` (the whole point is `std::random::SystemRng`), so it can only be built for a
# `*-unknown-nife` target under the linked `nife-dev` toolchain with build-std; and it needs
# `--cfg getrandom_backend="custom"` in the consumer's rustflags, which the workspace crates must
# never inherit.
#
# `entropy_backend` is calef's, ruled 2026-08-18. It names the thing rather than the slot it fills:
# `entropy` and `entropy_protocol` are this tree's words for the domain, and a third participant takes
# the same stem. The refusals are recorded in src/lib.rs.

# Name: ratified 2026-08-18 (calef). `entropy` is this tree's word for the domain (`entropy` the
# service, `entropy_protocol` its contract) and a third participant takes the same stem. Refused:
# `getrandom_backend` (upstream's word for the slot, and the strongest rival, but it names the slot
# rather than the thing), `getrandom_nife`, and `entropy_shim`. The full argument, and why this package
# is neither in `patches/` nor in `crates/`, is in src/lib.rs.

[package]
name = "entropy_backend"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
path = "src/lib.rs"

# The only dependency, and it is here for a type rather than for a call: the hook's signature is
# `Result<(), getrandom::Error>` and nothing in this crate invokes anything from it. Both 0.3 and 0.4
# declare the same `__getrandom_v03_custom` symbol, so one definition serves a graph holding either
# or both; 0.4 is named here because it is the one that resolves for a fresh dependency.
[dependencies]
getrandom = "0.4"

# `getrandom` **0.2**, which is a different mechanism and is here for a different reason than the
# line above. 0.2 selects a custom backend through the `register_custom_getrandom!` macro, whose
# expansion is a `__getrandom_custom` symbol returning a bare `u32`, so no type from this crate is
# needed to define it. What IS needed is 0.2's `custom` **feature**: without it 0.2's own ladder
# reaches `compile_error!` before it ever looks for the symbol, and a feature can only be turned on
# by a manifest. Naming it here turns it on for every graph that takes this crate, which is the
# point: a consumer cannot be expected to know that one of its transitive dependencies pinned the
# older major.
#
# The cost is one extra crate in the graph of a consumer that only ever needed 0.4. That is stated
# rather than hidden; `rustls-rustcrypto` reaches 0.2 through `rand_core` 0.6 and is the reason
# this exists: milestone 442 (a crypto provider `rustls` can use on all three bare-metal
# targets).
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
