# The gateway that lets a mechanical lane run on a rented open-weight model.
#
# Claude Code speaks the Anthropic Messages API and nothing else; OpenRouter speaks the OpenAI
# chat-completions API and nothing else. LiteLLM sits between them, exposing `/v1/messages` and
# translating. It does no inference, so it costs this machine almost nothing, which matters because
# patagonia's 16 GB is already the constraint on lane count (notes/open-model-lanes.md).
#
#     scripts/open-lane-gateway.sh          # start it
#     scripts/open-lane.sh <worktree> <brief>
#
# **The model ids below are candidates, not a recommendation.** Nothing in this tree has measured
# which open-weight model drives Claude Code's tool loop reliably, and no documentation vouches for
# it. Pick one, benchmark it on a real mechanical lane, and record what it scored.

model_list:
  # The name a lane asks for. Point it at whichever candidate is being measured.
  - model_name: open-lane
    litellm_params:
      model: openrouter/qwen/qwen3-coder
      api_key: os.environ/OPENROUTER_API_KEY

  # Candidates, addressable by name so a benchmark can switch without editing the lane script.
  - model_name: open-lane-qwen
    litellm_params:
      model: openrouter/qwen/qwen3-coder
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: open-lane-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: open-lane-glm
    litellm_params:
      model: openrouter/z-ai/glm-4.6
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  # A lane that hangs costs a round of budget and tells nobody, so fail rather than wait.
  request_timeout: 600
  drop_params: true          # strip request fields the upstream model does not know
  set_verbose: false

# No `master_key`. calef ruled on 2026-09-22: the tailnet is the boundary and the OpenRouter key
# already carries a spend limit, so a second secret is ceremony. See notes/open-model-lanes.md for
# what that accepts.
