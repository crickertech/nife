name: mutation testing

# **Would any test notice if this line were wrong?** Asked weekly, of every host crate.
#
# The coverage job answers "did this line run"; cargo-mutants answers the question that suite
# actually exists for, by rewriting one function at a time and rerunning the tests. A survivor is a
# place the code could be wrong with every test staying green. The baseline this reports against
# lives in .cargo/mutants-baseline.txt, with the prose (what each survivor means, and the triage
# rule for new ones) in notes/mutation-testing.md.
#
# **A report, not a gate**, per roadmap 85: the full run costs hours, so it cannot sit on a merge,
# and a new survivor is a worklist entry, not a defect in whatever commit happened to precede the
# weekly cron. It becomes a gate only if these numbers prove stable enough that a new survivor
# deserves to fail something; that decision is on the record there, not here.
#
# Weekly rather than per-push for cost, sharded eight ways for wall clock: the full run is **9,857
# mutants** as of 2026-09-03, each one a build plus a test run, so about 1,230 to a shard. (It was
# ~6,000 when this workflow was written a month earlier, which is the rate this tree grows at and
# the reason the box below is generous.)
#
# **Shards split the mutant list, not the crates, and `round-robin` rather than the default
# `slice`.** Mutant `i` goes to shard `i % 8`, so every shard holds a sample of every crate instead
# of an alphabetical block of a few. Two things follow, and the second is why it changed. The jobs
# finish together instead of one carrying `filesystem_proto` alone, which is what the original
# four-way split was reaching for. And **a lost shard costs an eighth of every crate rather than all
# of a few**: with `slice`, losing shard 1 on 2026-08-31 meant `gpt` and `grant_plan` went entirely
# unmeasured and the surviving report could say nothing about them, where a round-robin loss leaves
# every crate with seven eighths of its mutants and a rate still worth reading.
#
# BUGS: **this workflow had never once succeeded** before milestone 238. Four scheduled runs,
# 2026-08-10 through 2026-08-31, every one red, found by milestone 232's audit (audit every check
# against two questions: does anything run it, and does it block) on 2026-09-03. Two distinct
# causes, and only one of them is fixed here:
#
#  1. **The shard indices were off by one, and that is repaired above.** `--shard 4/4` is not a
#     shard; cargo-mutants counts from zero and rejects k >= n. So one job died in twenty seconds
#     on every run, and shard 0 was never tested at all. `script/mutation` reported this correctly
#     and loudly ("run FAILED (exit 1): this is a broken run, not a survivor count") to a scheduled
#     job that nothing reads, which is the actual defect this milestone is about.
#  2. **The surviving shards are terminated by the runner, and that is NOT a resource problem in
#     the job.** This was the open question, and the resource sampler answered it on the first
#     instrumented run (2026-09-03). Shard 0 died 57 seconds after a sample showing **14.7 GB of
#     memory available of 16, and 107 GB of disk**; shard 2 died with 12.3 GB available, shard 1
#     with 10.7 GB. Every one ends the same way, `The runner has received a shutdown signal`, a
#     `cancelled` step, and every later step including the `if: always()` upload **skipped**, which
#     is the runner agent being killed rather than a process in the job failing. Across five runs,
#     13 of 20 shard jobs went this way, at wall-clock times from 3 to 49 minutes, with one shard
#     completing 2,462 mutants in 17m34s on the same machine class the same morning.
#
#     So the `-j 2` bound below is not the constraint here, whatever it is on a development
#     machine, and lowering it would cost hours for nothing. **Nothing in this repository can stop
#     the eviction**; what it can do is make each job a smaller bet, which is what the eight-way
#     round-robin split above is for. If that proves insufficient the next option is a self-hosted
#     runner, and that is calef's call rather than a workflow edit.
#
# The cost is not the missing weekly report. `design/fatal-risks.md`'s third risk stands at
# MEASURED green on a 2026-08-03 number and closes by saying "the weekly workflow already publishes
# the report", and that sentence is what makes a stale number acceptable. See
# notes/check-inventory.md and notes/mutation-testing.md.

on:
  schedule:
    # 05:00 UTC Monday: after the weekend's quiet, before the toolchain-drift daily at 07:00.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, the same decision every workflow here makes: this reads the
# source, runs the tests, and writes nothing but its own artifacts and summary.
permissions:
  contents: read

# A queued weekly run has nothing to say that the newer one will not say better.
concurrency:
  group: mutants
  cancel-in-progress: true

jobs:
  mutants:
    name: "mutants (shard ${{ matrix.shard }}/8)"
    runs-on: ubuntu-24.04-arm
    # A generous box around a run whose cost moves with the tree. Four shards of ~2,465 mutants
    # each as of 2026-09-03; the shard re-runs its own baseline build first, and a few mutants (dtb's walker, the
    # calendar parser) legitimately burn their whole auto-timeout, two minutes and change apiece.
    # Under the 6-hour job ceiling so a hang still fails loudly rather than billing silent hours.
    #
    # **The mutant timeout is the budget item, not the job timeout.** The baseline found 96 mutants
    # that hang rather than fail: a cursor `+=` becoming `-=` in a walker never terminates, so the
    # only thing that ends the run is cargo-mutants' per-mutant timeout. That timeout is auto-derived
    # from each package's own baseline test time (5x it, floor 20s), which on this tree came out at
    # 112 seconds, and 96 of those is nearly three hours of wall clock spent proving that infinite
    # loops are infinite. Sharded four ways that was about 45 minutes a shard when the corpus was
    # ~6,000 mutants, which is why the box below is 330 minutes and not 90. The first shard ever to
    # finish (2026-09-03, shard 3 of 4, 2,462 mutants) took 17m34s, so the box has room to spare.
    #
    # Do NOT remove the auto timeout, and think before overriding it with `--timeout`: too low and a
    # legitimately slow mutant is recorded as a hang it is not, which corrupts the one column of the
    # report that is supposed to mean "the tests noticed". If the hang budget ever needs cutting,
    # cut it by killing the hangs (they are real findings) rather than by shortening the clock.
    timeout-minutes: 330
    strategy:
      # One shard failing (a flaky test, a runner death) should not scrap the other three quarters
      # of the report.
      fail-fast: false
      matrix:
        # **Zero-indexed, because cargo-mutants counts shards from zero.** `--shard k/n` requires
        # k < n, so the old `[1, 2, 3, 4]` was two bugs wearing one costume: `--shard 4/4` was
        # rejected as an invalid argument before a single mutant ran (the twenty-second death on
        # every scheduled run since 2026-08-10), and `--shard 0/4`, the first quarter of the mutant
        # list, was never run at all.
        #
        # The tool's own `--help` is what invited the mistake, and it is worth knowing before
        # touching this line: it reads "specify as e.g. 1/4", which is a valid shard and reads
        # exactly like a one-based first-of-four. Milestone 238.
        #
        # **Eight rather than four, because jobs here get evicted and a shorter job survives more
        # often.** See the eviction paragraph in this file's BUGS. The measured shard time is about
        # 17 minutes at four ways, and the per-shard overhead sharding pays is tiny: the baseline
        # rebuild each shard does cost 3 seconds of build and 6 of test on 2026-09-03, against 17
        # minutes of mutants. Nothing is measured less; the same 9,857 mutants are attempted, in
        # smaller pieces, so a reclaimed runner costs an eighth of the corpus instead of a quarter.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # A prebuilt binary rather than `cargo install`, the same trade the supply-chain and coverage
      # jobs make. The version comes from .cargo-mutants-version so this and script/mutation cannot
      # disagree; cargo-mutants changes which mutants it GENERATES between versions, so an unpinned
      # tool would move the weekly numbers with nothing in the tree having changed.
      - name: Read the pinned cargo-mutants version
        id: mutants
        run: echo "version=$(cat .cargo-mutants-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-mutants@${{ steps.mutants.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # script/mutation runs -j 2, and that bound is load-bearing here too: each job holds a full
      # tree copy with its own target/, and the run that established the baseline OOM-killed a
      # 16 GiB machine at -j 4. These runners have no more headroom than that.
      #
      # **The resource line is not noise, it is the only autopsy available.** Three
      # of the four scheduled runs before milestone 238 ended with `The runner has received a
      # shutdown signal` partway through, which terminates the runner agent itself: an `if: always()`
      # step does not get to run, an artifact does not get uploaded, and the log stops at whatever
      # the step had already printed. So the evidence has to be *in the stream* before the death
      # rather than collected after it. `free` and `df` are one line every ten seconds against a job
      # that costs hours, and if the next death is memory or disk the last line before the cut says
      # so instead of leaving another lane to reproduce it.
      #
      # **Ten seconds rather than sixty, because sixty was measured and was too coarse.** On the
      # first instrumented run (2026-09-03) shard 1 died 41 seconds after its last sample, and that
      # sample showed 10.7 GB of memory free and 107 GB of disk: no pressure at all by the only
      # evidence available, and yet the previous sample a minute before that showed usage climbing
      # from 929 MB to 5,259 MB in sixty seconds. A sampler whose interval is longer than the event
      # it is watching for reports innocence, which is worse than reporting nothing.
      #
      # Read it with the run's own conclusion: a `cancelled` step plus a falling `available` column
      # is the runner being reclaimed for resource exhaustion, and a flat one is the host reclaiming
      # the VM for its own reasons, which is not something this repository can fix.
      - name: Run this shard of the mutants
        run: |
          while true; do
            echo "[resource] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "mem_used_mb="$3" mem_avail_mb="$7}') $(df -m --output=avail / | tail -1 | awk '{print "disk_avail_mb="$1}')"
            sleep 10
          done &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          script/mutation --shard ${{ matrix.shard }}/8 --sharding round-robin

      # Uploaded even when the step above hiccups: a partial report beats none, and the report job
      # below states which shards it actually saw.
      - name: Upload this shard's outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/*.txt
            mutants.out/outcomes.json
          if-no-files-found: warn

  report:
    name: report against the baseline
    needs: mutants
    # `always()`: three shards of survivors are still a report worth publishing when the fourth
    # died; the summary names the shards it aggregated.
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download every shard's outcomes
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-shard-*
          path: shards
      # **Find the run directories by what is in them, not by where they were meant to land.**
      # `set -- shards/mutants-shard-*` looked obviously right and had a failure mode nobody would
      # guess: `download-artifact` gives each artifact its own subdirectory when it fetches several,
      # and unpacks a LONE artifact flat into `path` instead. So the glob matched nothing, stayed
      # literal, and `script/mutation --report` said "no run output at shards/mutants-shard-*" and
      # exited 2 -- **only in the case where exactly one shard survived**, which is precisely the
      # case this job's `if: always()` exists to serve. It cost the one real report the 2026-09-03
      # run produced, and would have cost 2026-08-24's too.
      #
      # A search for `caught.txt` is indifferent to both layouts and to any future third one.
      - name: Publish the per-crate report
        run: |
          dirs=$(find shards -name caught.txt -exec dirname {} \; 2>/dev/null | sort -u)
          {
            echo '### Mutation testing: host crates'
            echo
            if [ -z "$dirs" ]; then
              echo '**No shard produced any output.** Every one of the four either failed before'
              echo 'testing a mutant or was terminated before it could upload. There is no report'
              echo 'to give, and that is the finding: see this workflow header, milestone 238.'
            else
              # shellcheck disable=SC2086  # $dirs is a deliberately word-split list of directories
              set -- $dirs
              echo "aggregated from: $* ($# of 8 shards)"
              echo
              echo '```'
              script/mutation --report "$@"
              echo '```'
              echo
              echo 'Baseline: `.cargo/mutants-baseline.txt`; triage rule and survivor prose:'
              echo '`notes/mutation-testing.md`. A survivor here is a worklist entry, not a failure.'
              echo
              echo '**A partial report is a partial number.** The shards are alphabetical slices of'
              echo 'the mutant list, not random samples, so a rate computed from some of them says'
              echo 'nothing about the whole corpus and must not be compared to the baseline total.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
