# Miri over the host crates, weekly (milestone 79, notes/undefined-behavior.md).
#
# **Why weekly rather than per-PR.** Miri interprets the host tests instead of executing them, at
# roughly a thousandth of native speed, so the sampled run is tens of minutes where the host tests
# are milliseconds. The class of bug it catches (aliasing, provenance, uninitialized reads) moves
# at the pace of `unsafe` blocks, not of commits; a weekly sweep plus `workflow_dispatch` for
# on-demand runs buys the coverage without growing a gate somebody waits on. Same reasoning that
# keeps fuzzing out of script/test.
#
# A schedule only fires on the default branch, so this is always a run against `main`; a red here
# is information about `main`, not about any PR, which is why nothing requires this check.
#
# The real work is script/undefined-behavior-check (the "Scripts to Rule Them All" pattern, notes/scripts.md), so CI
# runs exactly what a developer runs locally, and script/undefined-behavior-check self-provisions the miri component
# on the pinned toolchain.
#
# **Red from 2026-08-10 to 2026-09-03, and never once for undefined behaviour.**
# `crates/manual/tests/render.rs` reads `CARGO_MANIFEST_DIR` at run time, deliberately (the
# compile-time form bakes a stale absolute path), and Miri does not forward the environment by
# default, so `every_character_survives` panicked with `cargo sets this for tests: NotPresent` and
# the job exited 1. The same test passed under `cargo test` throughout. Found by milestone 232's
# audit (audit every check against two questions: does anything run it, and does it block), three
# weeks into the failure, because a scheduled workflow's red is an entry in the Actions tab with no
# badge and no notification.
#
# **The one-flag fix that everyone expected does not work, and finding that out is milestone 238's
# contribution here.** `MIRIFLAGS=-Zmiri-env-forward=CARGO_MANIFEST_DIR` is what Miri's own message
# suggests, and it gets the test past line 279 and straight into a second wall: the same test calls
# `read_dir` over three directories, and Miri's isolation refuses `opendir`. Clearing that needs
# `-Zmiri-disable-isolation` too, for the whole workspace run rather than for one test, and the
# measured cost of doing so is **0.74 seconds natively against more than 12 minutes under the
# interpreter, still unfinished when it was killed**.
#
# So the test gates itself out under `cfg(miri)` instead, with the reasoning at the test rather than
# here: `crates/manual` has no dependencies and no `unsafe`, the nineteen other tests in that file
# exercise the same renderer on in-memory input and do run under Miri, and what the corpus test adds
# is breadth rather than any path Miri could judge. That is the same `cfg(miri)` sampling convention
# `gpt`, `glob`, `calendar`, `cred` and `ntp_proto` already use, and "Miri-clean means the sampled
# paths" already covers it. See notes/undefined-behavior.md and notes/check-inventory.md.
#
# BUGS: **nothing here notices if this job stops running.** That is not fixed by turning it green,
# and it is what let three weeks pass. `script/cadence-check` (milestone 238) is the tripwire, run
# from `scripts/trunk-health.sh` rather than from a cron of its own, because a schedule that watches
# schedules fails the same silent way.
name: undefined-behavior check

on:
  schedule:
    # 06:00 UTC Mondays: after the daily toolchain-drift run at 07:00 would be wrong to copy, this
    # is an arbitrary quiet hour; the pin means no dependence on the nightly of the day.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, the same one-liner every workflow here carries: this repo's
# thesis is components holding the authority their job needs and nothing more, and this job only
# reads the tree.
permissions:
  contents: read

# A queued weekly run has nothing to say that the newer one will not say better.
concurrency:
  group: miri
  cancel-in-progress: true

jobs:
  miri:
    name: undefined-behavior check (host crates, sampled paths)
    runs-on: ubuntu-24.04-arm
    # The full sampled run measured 27 minutes wall on the dev machine (2026-08-03, 95 test
    # binaries, warm compile cache); the budget leaves room for a slower runner, a cold cache,
    # and for the suites to grow.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: script/undefined-behavior-check
        run: script/undefined-behavior-check
