[package]
name = "std_runtime_protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The std runtime contract (milestone 595 (provisional)): which capability slot a `std` program's
# PAL reads each authority from, and which virtual address its loader maps each shared page at.
# Three programs agree on it: the std PAL (`patches/std-nife/overlay/std/src/sys/pal/nife/rt.rs`,
# which gets this file generated into it verbatim by `cargo xtask std-src`), the progenitor's spawn
# service (`crates/system_initializer`), and the kernel test harness that stood in for the
# progenitor until this crate existed (`kernel/src/user/std_service.rs`, `fs_service.rs`). Pure
# constants, no_std, dependency-free, the split every other `*_protocol` crate the PAL reads makes.

[lints]
workspace = true

