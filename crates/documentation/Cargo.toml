[package]
name = "documentation"
version = "0.1.0"
edition = "2024"
license.workspace = true

# Milestone 40's pure logic, and only the logic: markdown bytes in, styled terminal bytes out, plus
# the search index both the host builder and the guest reader must agree on. No syscalls, no
# endpoints, no filesystem, no allocator. The program that does the IO is `user/src/mdr.rs`; this is
# the half that runs on the host in milliseconds and is reachable by Kani.
#
# **Zero dependencies, and no `alloc` on the guest path.** DECISIONS §46 rule 1: this is on the
# verification path, so we write it. The roadmap's plan was `pulldown-cmark`; it is not `no_std`
# (0.13's lib.rs has no `#![no_std]` and `parse.rs` uses `std::collections::HashMap`), and the std
# PAL a std program would run on has no stdin and no argv, so the viewer could neither page nor take
# a page name. See notes/documentation.md for the whole reversal.
#
# See notes/documentation.md.

[dependencies]

[features]
# The index **writer**, which runs only on the host inside `xtask` and is the one part of this crate
# that allocates. Off by default so the guest program links no allocator: a `no_std` binary that
# pulls in `alloc` needs `__rust_alloc` and an OOM handler, and `doc` has neither and wants neither.
# The *reader* is always compiled, because that is what runs confined.
#
# **`cargo test -p documentation` used to skip the builder's tests, and that was a hole rather than a
# caveat** (milestone 280). The paragraph here said so plainly, as a thing worth knowing, and left
# it at rung four: only `cargo test --workspace` reached them, because `xtask` depends on this crate
# with the feature on and cargo unifies features across one build. What nobody noticed is that the
# reader's tests are gated too, because every one of them needs `build` to make an index to read. So
# a single-crate run compiled away half of this crate's suite and every survivor of it counted as a
# gap: `cargo mutants` tests one package at a time, and that is what scored this crate 52% in the
# first published mutation report. See notes/mutation-testing.md.
builder = []

# **A dev-dependency on ourselves, which is the mechanism that closes the hole above.** Cargo allows
# a package to depend on itself for tests only, and resolver 2 unifies the feature across the test
# build, so `cargo test -p documentation` now compiles the builder and runs all twelve index tests
# while `cargo build -p documentation` still does not. Nothing a consumer sees changes: a dev
# dependency is not transitive, so `user` and `swish` link no allocator and did not have to say so.
#
# This is AGENTS.md's rung one rather than a note asking the next person to remember `--workspace`:
# the configuration that skips a third of the crate is no longer reachable by running its tests.
[dev-dependencies]
documentation = { version = "0.1.0", path = ".", features = ["builder"] }

[lints]
workspace = true
