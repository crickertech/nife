# The name and the reasons for it are in src/lib.rs's provenance block.
#
# A host crate `cargo xtask` uses to turn the riscv64 loader's ELF into the PE/COFF image UEFI
# firmware loads, because rustc has no riscv64 UEFI target. See src/lib.rs.
#
# **No dependencies.** It reads four ELF structures itself rather than through `crates/elf`, and
# src/lib.rs says why: that crate refuses both a foreign machine and a PIE, correctly for a loader.

[package]
name = "portable_executable"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true
