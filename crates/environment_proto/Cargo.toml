[package]
name = "environment_proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The inert-configuration contract (milestone 47's environment-variable fork, DECISIONS §111): the
# layout of the read-only page that carries TZ/LANG/TERM, and the closed, validated domains each
# declared key is checked against before it is allowed onto the page at all. Pure logic, host-tested,
# no_std, dependency-free, so whoever assembles the page (init, or a kernel test harness standing in
# for it today) and whoever reads it (the std PAL, eventually a no_std program) share ONE definition
# and cannot drift. The same split `clock_proto` makes for the wall clock and `filesystem_proto` for
# the filesystem contract.

