[package]
name = "boot_slot"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The two-slot boot state an installed machine keeps in its own GPT attribute bits, and the policy
# that reads it: which image to start, what to write before starting it, and what to do when every
# slot has failed. Pure computation and no I/O, the same rule
# `globally_unique_identifier_partition_table` and `file_allocation_table` keep, so the installer
# that writes the state and the loader that reads it share one implementation and the tests run on
# the host in milliseconds.
# See notes/boot-slots.md.

[lints]
workspace = true

[dependencies]
globally_unique_identifier_partition_table = { version = "0.1.0", path = "../globally_unique_identifier_partition_table" }
